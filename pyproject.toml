[project]
name = "pygments-renderer"
version = "1.2.0"
description = "A CLI tool that generates syntax-highlighted code screenshots as PNG images."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "LicenseRef-CSSM-Unlimited-2.0" }
authors = [
    { name = "ChernegaSergiy" }
]
keywords = ["pygments", "syntax-highlighting", "screenshot", "code"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "Pillow>=12.3.0",
    "Pygments>=2.21.0",
]

[project.scripts]
pygments-renderer = "pygments_renderer.scripts.generate:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"